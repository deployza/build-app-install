# vm/ziniapps-vm/otel.yaml — ziniapps-vm's COMPLETE OpenTelemetry Collector config.
#
# ONE FILE, EVERYTHING: receivers, processors, exporters and the service graph.
# This is exactly what lands at /etc/otelcol/config.yaml on the host — nothing
# assembles, templates or substitutes it. Install it with:
#
#   sudo bash vm/ziniapps-vm/install-otel.sh                  # on the box
#   ansible-playbook playbooks/ziniapps-vm.yml --tags otel   # from the controller
#
# install-otel.sh validates it against the host's pinned otelcol-contrib, checks
# host.project below against the metadata server, backs up the live config,
# swaps, restarts, and rolls back if the collector does not stay up.
#
# A "SERVICE" IS ONE PIPELINE, ONE service.name, ONE DESTINATION: a logs/<name>
# pipeline under service: and a matching resource/<name> processor. Change one
# without the other and you drop a service.name or reference a processor that
# does not exist. Services on this host: journal, tomcat, mysql, nginx, assess-server, systemetrics.
#
# Exactly three resource attributes reach the destination: service.name,
# host.name, host.project. Auth is IAM — the VM's attached service account needs
# roles/pubsub.publisher on both topics, which live in dz-devops, not in this
# host's project (a cross-project grant); there are no credentials in this file.
#
# NO extensions (no health_check), so the only signal an install worked is the
# systemd unit staying up. Keep it thin: tail, stamp, ship — no parsing here.

receivers:
  # Everything that logs to systemd: the OS, every service unit on the box, and
  # any application that logs to stdout rather than to a file. Apps SHOULD log
  # to stdout - every one that does needs no receiver of its own here.
  #
  # This is also where the collector's OWN startup errors land, which is the one
  # place an EACCES on a log source is ever reported. Losing this receiver means
  # losing the ability to debug the others.
  journald:
    directory: /var/log/journal

  # THE ONLY METRICS SOURCE IN THE TREE. Everything else here is logs.
  #
  # 60s, not the 10s default: these are host vitals for answering "was the box
  # sick at 3am", not a scheduler's input. Six scrapers at 10s is a surprising
  # number of points per day per host to pay Pub/Sub and the destination for.
  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu:
      load:
      memory:
      paging:
      network:
      # Disk vs filesystem: `disk` is I/O (reads, writes, time), `filesystem` is
      # capacity (used, free). The second is what actually pages someone at 3am,
      # so both are on.
      disk:
      filesystem:
  # TOMCAT'S OWN LOGS ONLY — the container, not the applications inside it.
  # Tomcat forks via catalina.sh, so almost nothing of substance reaches the
  # journal; these files are the record. Paths are fixed by
  # build-vm-images/install-tomcat.sh ($CATALINA_HOME=/home/tomcat/instance);
  # if that moves, this moves.
  #
  # THE `*/*.log` GLOB WAS DELIBERATELY REMOVED. It matched the per-app log
  # directories underneath, which now belong to each app's own filelog/<app>
  # receiver below, so that its lines carry that app's service.name rather than
  # `tomcat`. Putting it back would ship those files TWICE — once under each
  # identity — and you would pay for both at the destination.
  #
  # The cost of that choice, and it is a real one: AN APP WITH NO filelog/<app>
  # RECEIVER IS NOT COLLECTED AT ALL. Adding an app to a host means adding its
  # receiver, resource/<app> processor and pipeline here, not just its WAR.
  filelog/tomcat:
    include:
      - /home/tomcat/instance/logs/*.log
      - /home/tomcat/instance/logs/catalina.out
    include_file_path: true
    # Tail, do not replay. A restart of the collector must not re-ship a
    # fortnight of rotated history into the destination.
    start_at: end
    attributes:
      log.type: tomcat
  filelog/nginx:
    include:
      - /var/log/nginx/*.log
    include_file_path: true
    start_at: end
    attributes:
      log.type: nginx
  filelog/mysql:
    include:
      - /var/log/mysql/*.log
    include_file_path: true
    start_at: end
    attributes:
      log.type: mysql
  filelog/assess-server:
    include:
      - /home/tomcat/instance/logs/assess-server/*.log
    include_file_path: true
    # Tail, do not replay. A restart of the collector must not re-ship a
    # fortnight of rotated history into the destination.
    start_at: end
    attributes:
      log.type: assess-server

processors:
  # FIRST in every pipeline, always. A collector that OOMs is a collector that
  # takes its host's memory with it; this makes it drop data instead.
  memory_limiter:
    check_interval: 5s
    limit_percentage: 20
    spike_limit_percentage: 5

  # host.name AND NOTHING ELSE. The system detector enables host.name and
  # os.type by default and fifteen further attributes on request; os.type is
  # switched off explicitly because the agreed attribute set is exactly three —
  # service.name, host.name, host.project — and a detector that quietly starts
  # emitting a fourth is how a destination turns to mush.
  #
  # The gcp detector is NOT used. It would resolve the project as
  # cloud.account.id, under the wrong key, and bring cloud.*, GCE instance and
  # zone attributes with it.
  resourcedetection:
    detectors: [system]
    timeout: 5s
    override: false
    system:
      resource_attributes:
        host.name:
          enabled: true
        os.type:
          enabled: false

  # host.project, on every record. A constant: this VM does not change project.
  # install-otel.sh refuses the install if it disagrees with the metadata server,
  # so records are never stamped with a project the host is not in.
  resource/host:
    attributes:
      - key: host.project
        value: dz-ziniapps
        action: upsert

  # ---------------------------------------------------------------------------
  # ONE PER SERVICE. This is what makes a "service" a service: a pipeline of its
  # own, stamped with its own service.name. The name here and the pipeline that
  # uses it under service: are two halves of one statement — change one and
  # you must change the other.
  #
  # deployment.environment and image.flavor are deliberately NOT stamped. If you
  # want them back, they belong here, and retrofitting them later means
  # reindexing whatever has already been written.
  # ---------------------------------------------------------------------------
  resource/journal:
    attributes:
      - key: service.name
        value: journal
        action: upsert

  resource/tomcat:
    attributes:
      - key: service.name
        value: tomcat
        action: upsert

  resource/mysql:
    attributes:
      - key: service.name
        value: mysql
        action: upsert

  resource/nginx:
    attributes:
      - key: service.name
        value: nginx
        action: upsert

  resource/assess-server:
    attributes:
      - key: service.name
        value: assess-server
        action: upsert

  resource/systemetrics:
    attributes:
      - key: service.name
        value: systemetrics
        action: upsert

  # LAST in every pipeline, after everything that might drop or modify a record.
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  # TWO EXPORTERS, ONE PER SIGNAL, because they are two topics. Every logs
  # pipeline on this host ends here; telling one service's lines from another's
  # downstream is a SUBSCRIBER concern, keyed on the service.name each pipeline
  # stamps above.
  googlecloudpubsub/logs:
    # Fully qualified, which the exporter requires — a bare topic id is
    # rejected. THE TOPICS ARE CENTRAL, in dz-devops, shared by every host —
    # not in this instance's own project (dz-ziniapps). Change the project segment
    # here AND in the metrics topic below together; host.project above is a
    # different statement (where the HOST lives) and stays as it is.
    topic: projects/dz-devops/topics/prod.vm.logs-topic
    compression: gzip

    # The standard exporterhelper backoff. NOTE THE KEY: `retry_on_failure`,
    # not the `retry` that the Elasticsearch exporter used.
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      # Give up after 5 minutes rather than holding a growing in-memory queue
      # against a destination that is not coming back.
      max_elapsed_time: 300s

    sending_queue:
      enabled: true
      # IN MEMORY, NOT ON DISK. A persistent queue needs the file_storage
      # extension, and durable buffering is a job for a gateway collector — see
      # build-docs/ops-execution.md. The cost of that choice: logs buffered here
      # are lost if the VM restarts while the destination is down.
      queue_size: 1000

  googlecloudpubsub/metrics:
    topic: projects/dz-devops/topics/prod.vm.metrics-topic
    compression: gzip

    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 300s

    sending_queue:
      enabled: true
      # Smaller than the logs queue on purpose: one scrape every 60s cannot
      # build the backlog a busy filelog tail can, and both queues are charged
      # against the same memory_limiter.
      queue_size: 200

service:
  # NO `extensions:` KEY EITHER — see the header. Adding health_check back here
  # and under processors/exporters is all it would take to make a real health check
  # possible again.
  pipelines:
    # -------------------------------------------------------------------------
    # LOGS. Every pipeline here is the same shape: one receiver, the shared
    # processors, that service's own stamp, one topic. memory_limiter is first
    # and batch is last in each — the first so a spike is dropped rather than
    # taking the host's memory with it, the last so nothing that might drop or
    # modify a record runs after batching.
    # -------------------------------------------------------------------------
    logs/journal:
      receivers: [journald]
      processors: [memory_limiter, resourcedetection, resource/host, resource/journal, batch]
      exporters: [googlecloudpubsub/logs]

    logs/tomcat:
      receivers: [filelog/tomcat]
      processors: [memory_limiter, resourcedetection, resource/host, resource/tomcat, batch]
      exporters: [googlecloudpubsub/logs]

    logs/mysql:
      receivers: [filelog/mysql]
      processors: [memory_limiter, resourcedetection, resource/host, resource/mysql, batch]
      exporters: [googlecloudpubsub/logs]

    logs/nginx:
      receivers: [filelog/nginx]
      processors: [memory_limiter, resourcedetection, resource/host, resource/nginx, batch]
      exporters: [googlecloudpubsub/logs]

    # The one app-level service on this host. Its receiver reads
    # logs/assess-server/ only, and filelog/tomcat no longer globs that
    # directory, so these lines ship exactly once and only under this name.
    logs/assess-server:
      receivers: [filelog/assess-server]
      processors: [memory_limiter, resourcedetection, resource/host, resource/assess-server, batch]
      exporters: [googlecloudpubsub/logs]

    # -------------------------------------------------------------------------
    # METRICS. One pipeline, one topic, separate from logs.
    # -------------------------------------------------------------------------
    metrics/host:
      receivers: [hostmetrics]
      processors: [memory_limiter, resourcedetection, resource/host, resource/systemetrics, batch]
      exporters: [googlecloudpubsub/metrics]

  telemetry:
    logs:
      # The collector's own logs land in the journal under its unit — and are
      # then picked up by the journald receiver above, so they reach Pub/Sub as
      # service.name=journal. This is also where an EACCES on a log source
      # appears, once, at startup:
      #   sudo journalctl -u otelcol -b
      level: info
