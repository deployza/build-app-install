# system: nginx
#
# A COMPLETE collector config, except for two tokens (@EXPORTER@ and
# @EXPORTER_NAME@) that push.sh fills from vm/vms/<vm>/exporter.yaml — the
# target host's exporter, which is the only source of one.
# Nothing merges this with anything: apply.sh swaps it in whole.
#
# THIN BY DESIGN. It tails, stamps resource attributes, and ships. There is no
# grok, no JSON parsing, no severity mapping and no per-application handling —
# that work belongs in a gateway collector or in the destination, where fixing
# a bad pattern is one deploy instead of a fleet rollout. See
# ../../../build-docs/ops-execution.md, "thin edge, smart aggregator".
#
# If you find yourself adding a parser here, that is the signal to stand up the
# gateway, not to thicken the edge.

extensions:
  # apply.sh polls this to decide whether a pushed config actually came up, and
  # rolls back if it does not answer. Every config MUST declare it on this
  # endpoint. Loopback only — it is an operator signal, not a service.
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  # Everything that logs to systemd: the OS, every service unit on the box, and
  # any application that logs to stdout rather than to a file. Apps SHOULD log
  # to stdout - every one that does needs no receiver of its own here.
  journald:
    directory: /var/log/journal

  filelog/nginx:
    include:
      - /var/log/nginx/*.log
    include_file_path: true
    start_at: end
    attributes:
      log.type: nginx

processors:
  # FIRST in the pipeline, always. A collector that OOMs is a collector that
  # takes its host's memory with it; this makes it drop data instead.
  memory_limiter:
    check_interval: 5s
    limit_percentage: 20
    spike_limit_percentage: 5

  # host.name, cloud.*, GCE instance/zone/project — resolved on the box rather
  # than baked in, so a cloned VM never reports as its source.
  resourcedetection:
    detectors: [env, gcp, system]
    timeout: 5s
    override: false

  # WITHOUT THESE THE DESTINATION IS AN UNDIFFERENTIATED MUSH, and retrofitting
  # them later means reindexing. deployment.environment and service.name come
  # from /etc/otelcol/env, written by apply.sh, so one config serves dev and
  # prod.
  resource:
    attributes:
      - key: image.flavor
        value: nginx
        action: upsert
      - key: deployment.environment
        value: ${env:OTEL_DEPLOY_ENV}
        action: upsert
      - key: service.name
        value: ${env:OTEL_SERVICE_NAME}
        action: upsert

  # LAST, after everything that might drop or modify a record.
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
@EXPORTER@

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [journald, filelog/nginx]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [@EXPORTER_NAME@]

  telemetry:
    logs:
      # The collector's own logs land in the journal under its unit. This is
      # where an EACCES on a log source appears — once, at startup:
      #   sudo journalctl -u otelcol -b
      level: info
