# receivers: filelog/mysql
#
# system: mysql — WHAT TO COLLECT on a host running MySQL, and nothing else.
# This file is a FRAGMENT, not a config: it contributes receivers to the
# `receivers:` map of the instance's pipeline.yaml, already indented to sit
# under that key. It declares no processors, no exporters and no service —
# those are the instance layer's, in vm/instances/<vm>/pipeline.yaml.
#
# The leading `# receivers:` line is LOAD-BEARING: push.sh reads the names it
# must add to service.pipelines.logs.receivers from it, so the header and the
# block below can never disagree. The header is STRIPPED at render time;
# comments INSIDE the block are kept.
#
# `journald` is NOT here — it is in _base.yaml, spliced into every render.
#
# COMBINED FLAVORS SPLICE SEVERAL OF THESE, so every receiver key here must be
# unique across the whole folder.

  filelog/mysql:
    include:
      - /var/log/mysql/*.log
    include_file_path: true
    start_at: end
    attributes:
      log.type: mysql
