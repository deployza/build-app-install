# receivers: filelog/tomcat
#
# system: tomcat — WHAT TO COLLECT on a host running Tomcat, and nothing else.
# This file is a FRAGMENT, not a config: it contributes receivers to the
# `receivers:` map of the instance's pipeline.yaml, already indented to sit
# under that key. It declares no processors, no exporters and no service —
# those are the instance layer's, in vm/instances/<vm>/pipeline.yaml.
#
# The leading `# receivers:` line is LOAD-BEARING: push.sh reads the names it
# must add to service.pipelines.logs.receivers from it, so the header and the
# block below can never disagree. The header is STRIPPED at render time;
# comments INSIDE the block are kept.
#
# `journald` is NOT here — it is in _base.yaml, spliced into every render.
#
# COMBINED FLAVORS SPLICE SEVERAL OF THESE. A `tomcat-nginx-mysql` target gets
# this fragment plus nginx.yaml plus mysql.yaml, so every receiver key here must
# be unique across the whole folder. Prefixing with `filelog/` and the server
# name is what keeps that true.
#
# THIN BY DESIGN. Tail and ship. No grok, no JSON parsing, no severity mapping —
# that work belongs in a gateway collector or in the destination, where fixing a
# bad pattern is one deploy instead of a fleet rollout. See
# ../../../build-docs/ops-execution.md, "thin edge, smart aggregator". If you
# find yourself adding a parser here, that is the signal to stand up the
# gateway, not to thicken the edge.

  # TOMCAT'S OWN LOGS ONLY — the container, not the applications inside it.
  # Tomcat forks via catalina.sh, so almost nothing of substance reaches the
  # journal; these files are the record. Paths are fixed by
  # build-vm-images/install-tomcat.sh ($CATALINA_HOME=/home/tomcat/instance);
  # if that moves, this moves.
  #
  # THE `*/*.log` GLOB WAS DELIBERATELY REMOVED. It matched the per-app log
  # directories underneath, which now belong to each app's own receiver in
  # vm/apps/<app>/receiver.yaml so that its lines carry that app's service.name
  # rather than `tomcat`. Putting it back would ship those files TWICE — once
  # under each identity — and you would pay for both at the destination.
  #
  # The cost of that choice, and it is a real one: AN APP WITH NO
  # receiver.yaml IS NOT COLLECTED AT ALL. Adding an app to a host means adding
  # its receiver file and its pipeline, not just its WAR.
  filelog/tomcat:
    include:
      - /home/tomcat/instance/logs/*.log
      - /home/tomcat/instance/logs/catalina.out
    include_file_path: true
    # Tail, do not replay. A restart of the collector must not re-ship a
    # fortnight of rotated history into the destination.
    start_at: end
    attributes:
      log.type: tomcat
