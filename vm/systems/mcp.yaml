# receivers:
#
# system: mcp — DELIBERATELY EMPTY. An mcp host runs no log-file-producing
# server of its own: everything it emits goes to stdout and therefore to the
# journal, which _base.yaml already collects on every host.
#
# The file exists rather than being absent because push.sh requires a fragment
# per flavor token. A missing one is "you pushed to a flavor nobody has
# described yet" and fails the push; this one is "there is nothing to add here",
# which is a different statement and worth writing down.
#
# The `# receivers:` header is present and EMPTY, which is what tells push.sh
# this fragment contributes no names to the pipeline. Do not delete the line.
