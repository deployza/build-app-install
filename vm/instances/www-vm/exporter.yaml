# www-vm's PROCESSORS AND EXPORTERS — everything between the receivers and the
# wire. Spliced whole into this VM's pipeline.yaml at the @EXPORTER@ token,
# which sits at column 0 because this file declares TWO top-level keys, not one.
#
# THE HEADER IS STRIPPED at render time: splicing starts at the first
# non-comment line below. Comments INSIDE the blocks are kept — they end up in
# config.yaml on the VM, which is where they are wanted.
#
# WHY BOTH LIVE HERE. A VM runs ONE collector with ONE config.yaml, so its
# destination and the way its records are stamped are properties of the host,
# not of any server running on it. What each server WRITES is the opposite — a
# property of the software, identical on every box — and lives in vm/systems/
# and vm/apps/.
#
# AUTHENTICATION IS IAM, NOT A CREDENTIAL IN THIS FILE. The exporter uses
# Application Default Credentials, which on a GCE instance means the VM's
# ATTACHED SERVICE ACCOUNT. That account needs roles/pubsub.publisher on both
# topics below and nothing else. There is no api_key, no endpoint secret, and
# therefore nothing here that has to be kept out of git.
#
# THIS HOST DOES NOT EXIST YET. www-website and www-apidocs are written and
# install.sh is ready, but nothing is baked or running. The file is here so the
# exporter exists the day the host does; delete the folder if that host is not
# coming.
#
# @PROJECT@ is filled by push.sh from its own --project flag, which is
# necessarily the project the instance lives in.

processors:
  # FIRST in every pipeline, always. A collector that OOMs is a collector that
  # takes its host's memory with it; this makes it drop data instead.
  memory_limiter:
    check_interval: 5s
    limit_percentage: 20
    spike_limit_percentage: 5

  # host.name AND NOTHING ELSE. The system detector enables host.name and
  # os.type by default and fifteen further attributes on request; os.type is
  # switched off explicitly because the agreed attribute set is exactly three —
  # service.name, host.name, host.project.
  #
  # The gcp detector is NOT used. It would resolve the project as
  # cloud.account.id, under the wrong key, and bring cloud.*, GCE instance and
  # zone attributes with it.
  resourcedetection:
    detectors: [system]
    timeout: 5s
    override: false
    system:
      resource_attributes:
        host.name:
          enabled: true
        os.type:
          enabled: false

  # host.project, on every record, from the pusher rather than the metadata
  # server: push.sh had to be told --project to reach this box at all, so it
  # cannot be pushing a value that belongs to a different project.
  resource/host:
    attributes:
      - key: host.project
        value: @PROJECT@
        action: upsert

  # ---------------------------------------------------------------------------
  # ONE PER SERVICE. www-vm runs fewer than ziniapps-vm: both sites it serves
  # (www-website, www-apidocs) are static and go through nginx, so neither is a
  # service in its own right and neither has a receiver file. Give one its own
  # pipeline only when it starts writing somewhere nginx does not.
  # ---------------------------------------------------------------------------
  resource/journal:
    attributes:
      - key: service.name
        value: journal
        action: upsert

  resource/nginx:
    attributes:
      - key: service.name
        value: nginx
        action: upsert

  resource/systemetrics:
    attributes:
      - key: service.name
        value: systemetrics
        action: upsert

  # LAST in every pipeline, after everything that might drop or modify a record.
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  # TWO EXPORTERS, ONE PER SIGNAL, because they are two topics. Every logs
  # pipeline on this host ends here; telling one service's lines from another's
  # downstream is a SUBSCRIBER concern, keyed on the service.name each pipeline
  # stamps above.
  googlecloudpubsub/logs:
    # Fully qualified, which the exporter requires — a bare topic id is
    # rejected. THIS ASSUMES THE TOPICS LIVE IN THE INSTANCE'S OWN PROJECT. If
    # they are central to one project instead, replace @PROJECT@ here with that
    # project id; it is a one-line change and nothing else depends on it.
    topic: projects/@PROJECT@/topics/prod.vm.logs-topic
    compression: gzip

    # The standard exporterhelper backoff. NOTE THE KEY: `retry_on_failure`,
    # not the `retry` that the Elasticsearch exporter used.
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      # Give up after 5 minutes rather than holding a growing in-memory queue
      # against a destination that is not coming back.
      max_elapsed_time: 300s

    sending_queue:
      enabled: true
      # IN MEMORY, NOT ON DISK. A persistent queue needs the file_storage
      # extension, and durable buffering is a job for a gateway collector — see
      # build-docs/ops-execution.md. The cost of that choice: logs buffered here
      # are lost if the VM restarts while the destination is down.
      queue_size: 1000

  googlecloudpubsub/metrics:
    topic: projects/@PROJECT@/topics/prod.vm.metrics-topic
    compression: gzip

    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      max_elapsed_time: 300s

    sending_queue:
      enabled: true
      # Smaller than the logs queue on purpose: one scrape every 60s cannot
      # build the backlog a busy filelog tail can, and both queues are charged
      # against the same memory_limiter.
      queue_size: 200
