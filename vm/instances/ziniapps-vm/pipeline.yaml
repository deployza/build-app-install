# apps: assess-server
#
# ziniapps-vm's SERVICE GRAPH — which receiver feeds which exporter, under which
# identity. This is the file that says what a "service" IS here: one pipeline,
# one service.name, one destination.
#
# THE SERVICES ON THIS HOST are journal, tomcat, mysql, nginx, assess-server and
# systemetrics. Each has a pipeline below and a matching resource/<name>
# processor in exporter.yaml; the two are halves of one statement, and changing
# one without the other either drops a service.name or names a processor that
# does not exist.
#
# WHERE THE PIECES COME FROM:
#   @RECEIVERS@  <- ../../systems/_base.yaml        journald + hostmetrics
#                   ../../systems/<server>.yaml     one per token in the flavor
#                   ../../apps/<app>/receiver.yaml  one per name in `# apps:`
#   @EXPORTER@   <- ./exporter.yaml                 processors AND exporters
#   @PROJECT@    <- push.sh --project               substituted inline
#
# The `# apps:` header above is LOAD-BEARING and is read by push.sh: it names
# the app fragments to splice. assess-server is on it because it is a service in
# its own right; the other four apps on this host (assess-ui, assess-exam,
# ziniapps-go, ziniapps-www) are not, and their lines reach the destination as
# `tomcat` or `nginx`. Adding a name here is half the job — the app also needs a
# pipeline below and a resource/<app> processor.
#
# THERE IS NO `extensions:` BLOCK, deliberately, and that has a cost: apply.sh
# can no longer poll a health endpoint to decide whether a push worked, so it
# falls back to "the systemd unit is still up N seconds after restart". A config
# that starts cleanly but fails to bring up a pipeline will be ACCEPTED rather
# than rolled back. See apply.sh's verify step.
#
# BLOCK TOKENS ARE SPLICED ONLY ON A LINE THAT IS NOTHING BUT THE TOKEN. This
# header names them all in prose; matching is anchored so that is safe. Keep
# them on their own lines.

receivers:
@RECEIVERS@

@EXPORTER@

service:
  # NO `extensions:` KEY EITHER — see the header. Adding health_check back here
  # and in exporter.yaml is all it would take to restore apply.sh's rollback.
  pipelines:
    # -------------------------------------------------------------------------
    # LOGS. Every pipeline here is the same shape: one receiver, the shared
    # processors, that service's own stamp, one topic. memory_limiter is first
    # and batch is last in each — the first so a spike is dropped rather than
    # taking the host's memory with it, the last so nothing that might drop or
    # modify a record runs after batching.
    # -------------------------------------------------------------------------
    logs/journal:
      receivers: [journald]
      processors: [memory_limiter, resourcedetection, resource/host, resource/journal, batch]
      exporters: [googlecloudpubsub/logs]

    logs/tomcat:
      receivers: [filelog/tomcat]
      processors: [memory_limiter, resourcedetection, resource/host, resource/tomcat, batch]
      exporters: [googlecloudpubsub/logs]

    logs/mysql:
      receivers: [filelog/mysql]
      processors: [memory_limiter, resourcedetection, resource/host, resource/mysql, batch]
      exporters: [googlecloudpubsub/logs]

    logs/nginx:
      receivers: [filelog/nginx]
      processors: [memory_limiter, resourcedetection, resource/host, resource/nginx, batch]
      exporters: [googlecloudpubsub/logs]

    # The one app-level service on this host. Its receiver reads
    # logs/assess-server/ only, and systems/tomcat.yaml no longer globs that
    # directory, so these lines ship exactly once and only under this name.
    logs/assess-server:
      receivers: [filelog/assess-server]
      processors: [memory_limiter, resourcedetection, resource/host, resource/assess-server, batch]
      exporters: [googlecloudpubsub/logs]

    # -------------------------------------------------------------------------
    # METRICS. One pipeline, one topic, separate from logs.
    # -------------------------------------------------------------------------
    metrics/host:
      receivers: [hostmetrics]
      processors: [memory_limiter, resourcedetection, resource/host, resource/systemetrics, batch]
      exporters: [googlecloudpubsub/metrics]

  telemetry:
    logs:
      # The collector's own logs land in the journal under its unit — and are
      # then picked up by the journald receiver above, so they reach Pub/Sub as
      # service.name=journal. This is also where an EACCES on a log source
      # appears, once, at startup:
      #   sudo journalctl -u otelcol -b
      level: info
