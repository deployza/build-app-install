# receivers: filelog/assess-server
#
# WHAT assess-server WRITES, and where. A FRAGMENT, not a config: it contributes
# receivers to the `receivers:` map of an instance's pipeline.yaml, already
# indented to sit under that key. It declares no processors, no exporters and no
# service — those are the instance layer's.
#
# THE FIRST APP-LEVEL RECEIVER IN THE TREE. It exists because assess-server is
# a SERVICE in its own right on ziniapps-vm: its lines carry
# service.name=assess-server rather than being folded into `tomcat`.
#
# THIS FILE AND systems/tomcat.yaml MUST NOT OVERLAP. tomcat.yaml deliberately
# dropped its `logs/*/*.log` glob so that these files have exactly one receiver
# and ship exactly once. If you widen either include list, check the other.
#
# Tomcat writes an app's logs here because assess-server's logback config points
# at ${catalina.base}/logs/assess-server — see the app's conf/ in GCS. If that
# changes, this changes.
#
# The leading `# receivers:` line is LOAD-BEARING: push.sh reads it to check for
# duplicate keys across fragments and to check that every receiver a pipeline
# names exists. The header is STRIPPED at render time; comments INSIDE the block
# are kept.
#
# A FRAGMENT IS NOT ENOUGH ON ITS OWN. An app is collected only when its VM
# names it in pipeline.yaml's `# apps:` header AND gives it a pipeline.

  filelog/assess-server:
    include:
      - /home/tomcat/instance/logs/assess-server/*.log
    include_file_path: true
    # Tail, do not replay. A restart of the collector must not re-ship a
    # fortnight of rotated history into the destination.
    start_at: end
    attributes:
      log.type: assess-server
