# vm/mcp/inert.yaml — COLLECT NOTHING, SEND NOWHERE. (Every VM folder has its own copy.)
#
# install-otel.sh (beside it) installs this instead of otel.yaml in two cases:
#   * the folder has no otel.yaml
#   * --inert was passed — the off switch, for taking a host out of monitoring
#     without rebuilding its image or deleting its folder
#
# It goes through the same validate, swap, restart and settle as a real config,
# so "off" is exercised rather than special-cased.
#
# A collector running this stays UP and reports nothing wrong. That is not a bug
# and it is the reason "up" never means shipping.

receivers:
  # A pipeline needs at least one of each to be valid, so the nop components
  # stand in. They read nothing and write nothing.
  nop:

exporters:
  nop:

service:
  pipelines:
    logs:
      receivers: [nop]
      exporters: [nop]

  telemetry:
    logs:
      level: info
