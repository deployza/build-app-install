# ansible/ansible.cfg — controller-side settings for the VM push.
#
# EVERY CONNECTION IN THIS INVENTORY GOES THROUGH AN IAP TUNNEL, which is a
# fresh `gcloud compute start-iap-tunnel` process and an HTTPS/WebSocket
# handshake to tunnel.cloudproxy.app. Opening one costs seconds, not
# milliseconds, so the two settings that matter most here are pipelining and
# ControlPersist: without them a ten-task role pays that cost ten times.
#
# Run from THIS directory (ansible/) so the relative paths below resolve:
#   ansible-playbook playbooks/ziniapps-vm.yml
[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
# Deploy output is the point — these scripts echo their whole run and that is
# the only log of what happened. Keep it readable rather than one JSON blob.
stdout_callback      = yaml
display_skipped_hosts = False
interpreter_python   = auto_silent

[ssh_connection]
# One SSH invocation per task instead of one per module transfer. Over a tunnel
# this is the difference between a deploy that takes a minute and one that takes
# five.
pipelining   = True
# Reuse the tunnel across tasks. 10m outlasts any single play here.
ssh_args     = -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30
