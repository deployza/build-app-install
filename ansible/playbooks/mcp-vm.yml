---
# mcp-vm — the MCP server in dz-builds, inventory host `mcp`, folder vm/mcp-vm/.
#
# ONE UNIT: otel. vm/mcp-vm/ holds no app scripts, so nothing in this repo installs
# an app here, and vm/mcp-vm/install-otel.sh installs vm/mcp-vm/inert.yaml — collect nothing,
# send nowhere — through the same validate, swap, restart and settle as a real
# config. It still adds otelcol to its groups and asserts the backup slot.
#
# Give it vm/mcp-vm/otel.yaml when it needs to ship logs; this playbook needs no
# change for that.
#
#   ansible-playbook playbooks/mcp-vm.yml
- name: mcp
  hosts: mcp
  become: true
  roles:
    - { role: vm_push, tags: [always] }
    - { role: vm_unit, unit: otel, tags: [otel] }
