# ansible/inventory/hosts.yml — the fleet.
#
# THE HOST KEY IS THE GCE INSTANCE NAME, not a nickname: the ProxyCommand below
# passes it to `gcloud compute start-iap-tunnel %h`, so a key that is not the
# instance name fails to resolve rather than connecting to the wrong box. It is
# also what install-otel.sh is told with --vm, and what they would work out
# for themselves from `hostname -s` if nobody told them.
#
# THE KEY IS ALSO THE vm/<vm>/ FOLDER NAME, unless the host sets `vm_dir`.
# vm_push ships vm/<vm_dir>/ and the units run vm/<vm_dir>/install.sh. One host
# sets it: mcp, whose folder is vm/mcp-vm/. A folder named differently from its
# host must also hold an `instance` file naming the host, which install-otel.sh
# checks against --vm, so the two cannot drift silently. Every host has a
# folder, even one that collects nothing (mcp).
#
# WHICH UNITS A HOST HAS is its playbook's role list (playbooks/<vm>.yml), and
# their order is its vm/<vm>/install.sh UNITS. Nothing about units lives here.
#
# `app_env` is required by every unit except otel.
all:
  vars:
    # OS Login maps this identity to a Linux account on every target. On a
    # laptop, override it with your own:
    #   -e ansible_user=romil_deployza_com
    # From ops-vm it is the attached service account, which is what the
    # OS Login grants must name (ops-infra.md B.3) — grants to a human group
    # do nothing for a Semaphore run.
    ansible_user: ops-vm-sa@dz-devops.iam.gserviceaccount.com

    # IAP is not topological: the tunnel does not route through a VPC, so every
    # project below is reachable identically with no bastion and no peering.
    # --listen-on-stdin is what makes this usable as a ProxyCommand.
    ansible_ssh_common_args: >-
      -o ProxyCommand="gcloud compute start-iap-tunnel %h %p
      --listen-on-stdin --zone={{ zone }} --project={{ gcp_project }}"

  hosts:
    # --- dz-builds ------------------------------------------------------------
    # The MCP server: one app unit (mcp), then otel, which installs
    # vm/mcp-vm/inert.yaml — collect nothing, send nowhere. app_env selects
    # nothing for mcp (there is one server) but every app unit requires it.
    # NO mcp VM EXISTS TODAY: it was deleted on 2026-09-26. This entry is for the
    # next one (build-terraform dz-builds/mcp.md, "Rebuild the VM").
    mcp:
      gcp_project: dz-builds
      zone: asia-south1-c
      vm_dir: mcp-vm
      app_env: production

    # --- dz-ziniapps ----------------------------------------------------------
    # Three assess apps + two ziniapps sites. See
    # vm/ziniapps-vm/install.sh for the set and the order.
    ziniapps-vm:
      gcp_project: dz-ziniapps
      zone: asia-south1-c
      app_env: production

    # --- dz-api-host ----------------------------------------------------------
    # www.deployza.com: the marketing site + the MkDocs API docs.
    # NOT YET CREATED IN TERRAFORM — this entry is ready for when it is.
    deployza-vm:
      gcp_project: dz-api-host
      zone: asia-south1-c
      app_env: production

    # --- dz-devops ------------------------------------------------------------
    # The controller itself in the end state (ops-infra.md Part A). It runs none
    # of vm/ — ClickHouse, Grafana and Semaphore are configured by a different
    # push shape — and it does not tunnel to itself. Its playbook has no units.
    # NOT YET CREATED IN TERRAFORM. Its image family, dz-ops, exists.
    ops-vm:
      gcp_project: dz-devops
      zone: asia-south1-c
      ansible_connection: local
