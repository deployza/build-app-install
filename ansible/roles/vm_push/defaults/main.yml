---
# The repo root (build-ops/), two levels above playbooks/. The playbooks
# and the scripts they push are one checkout and one commit.
app_src_root: "{{ playbook_dir }}/../.."

# Must match STAGE_ROOT in every vm/<vm>/common.sh. The tree lands in repo/; each app stages
# into its own sibling ${STAGE_ROOT}/<APP_NAME>/, which this role must not touch.
stage_root: /tmp/deployza
repo_dir: "{{ stage_root }}/repo"
