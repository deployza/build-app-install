---
# vm_push — put this host's part of vm/ on the host, once per run.
#
# LISTED FIRST IN EVERY VM PLAYBOOK AND TAGGED `always`, so whichever units
# --tags selects, the scripts they run are there. The units themselves
# (vm_unit) only invoke.
#
# THE PAYLOAD IS THE HOST'S WHOLE FOLDER, NOT A PRUNED LIST: vm/<vm>/ holds only
# what that host runs — its own common.sh, units.sh, install-otel.sh and
# inert.yaml included — so there is nothing to prune and nothing to add. The
# folder name IS the inventory key IS the GCE instance name unless the host sets
# `vm_dir` (mcp's folder is vm/mcp-vm/), and EVERY HOST HAS ONE: a host that
# collects nothing (mcp) has a folder holding only install-otel.sh, inert.yaml
# and its `instance` file. No folder is a refusal, not a fallback.

- name: Look for this host's vm/ folder
  ansible.builtin.stat:
    path: "{{ app_src_root }}/vm/{{ vm_dir | default(inventory_hostname) }}"
  delegate_to: localhost
  become: false
  register: _vm_dir

- name: Refuse a host with no vm/ folder
  ansible.builtin.assert:
    that: _vm_dir.stat.isdir | default(false)
    fail_msg: >-
      There is no vm/{{ vm_dir | default(inventory_hostname) }}/ folder. Every
      host needs one — even a host that collects nothing gets install-otel.sh
      and inert.yaml there (see vm/mcp-vm/).
    quiet: true

- name: Assemble the file list
  ansible.builtin.set_fact:
    _payload: "{{ ['vm/' ~ (vm_dir | default(inventory_hostname))] }}"

- name: Shipping
  ansible.builtin.debug:
    var: _payload

- name: Make a staging dir on the controller
  ansible.builtin.tempfile:
    state: directory
    suffix: "-{{ inventory_hostname }}-payload"
  delegate_to: localhost
  become: false
  changed_when: false
  register: _payload_dir

- name: Pack, ship and unpack
  block:
    - name: Pack it
      # Paths are relative to app_src_root so the tree unpacks as vm/<vm>/...,
      # which is the path vm_unit and a person on the box both run from.
      ansible.builtin.shell:
        cmd: >-
          tar czf '{{ _payload_dir.path }}/payload.tar.gz'
          -C '{{ app_src_root }}' {{ _payload | map('quote') | join(' ') }}
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Hash what is being shipped
      # The record that the bytes that ran are the bytes you had.
      ansible.builtin.stat:
        path: "{{ _payload_dir.path }}/payload.tar.gz"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: _payload_stat

    - name: Report the payload hash
      ansible.builtin.debug:
        msg: "payload sha256={{ _payload_stat.stat.checksum }} ({{ _payload_stat.stat.size }} bytes)"

    - name: Clear the previous push
      # A script left by an earlier push (a renamed or removed unit) would
      # otherwise still be sitting here and still be runnable. Only repo/ is
      # removed: the app staging dirs beside it belong to the app scripts.
      ansible.builtin.file:
        path: "{{ repo_dir }}"
        state: absent

    - name: Create the deploy root
      ansible.builtin.file:
        path: "{{ repo_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Unpack the payload
      ansible.builtin.unarchive:
        src: "{{ _payload_dir.path }}/payload.tar.gz"
        dest: "{{ repo_dir }}"
        owner: root
        group: root

  always:
    - name: Remove the controller staging dir
      ansible.builtin.file:
        path: "{{ _payload_dir.path }}"
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false
