# name: elasticsearch
#
# The first line above is LOAD-BEARING: push.sh reads the pipeline key from it,
# so the key and the block below can never disagree. THIS HEADER IS STRIPPED
# at render time: splicing starts at the first non-comment line below and
# lands at the exporter placeholder in configs/<flavor>.yaml, already indented
# to sit under `exporters:`. Comments INSIDE the block are kept - they end up
# in config.yaml on the VM, which is where they are wanted.
#
# Credentials come from /etc/otelcol/env (640 root:otelcol), written by
# apply.sh and fetched from Secret Manager by whoever runs push.sh. They are
# NOT in this file and must never be: this file is in git.
  elasticsearch:
    endpoints:
      - ${env:OTEL_ES_ENDPOINT}
    api_key: ${env:OTEL_ES_API_KEY}

    # One data stream for all VM logs. Routing by service or environment is a
    # QUERY concern, not an index concern - every record already carries
    # service.name, deployment.environment, image.flavor and log.type from the
    # resource processor. Splitting indices per app here would push a fleet
    # config change every time an app is added.
    logs_index: logs-deployza-vm

    retry:
      enabled: true
      initial_interval: 5s
      max_interval: 60s
      # Give up after 5 minutes rather than holding a growing in-memory queue
      # against a destination that is not coming back.
      max_elapsed_time: 300s

    sending_queue:
      enabled: true
      # IN MEMORY, NOT ON DISK. A persistent queue needs the file_storage
      # extension, which this file cannot declare (it only supplies an exporter
      # block), and durable buffering is a job for the gateway collector -
      # see ../../../build-docs/ops-execution.md. The cost of that choice: logs
      # buffered here are lost if the VM restarts while the destination is down.
      queue_size: 1000
