# CI for otel/ — renders EVERY flavor x exporter combination and validates each
# one with the real collector binary.
#
# THIS IS THE ONLY PLACE CONFIGS ARE VALIDATED. apply.sh deliberately does not
# run `otelcol validate` on the target: it is a schema and component check, so
# anything it would catch is caught here, before a VM is touched. What it
# CANNOT catch (a missing log dir, a bad credential, a busy port) is caught by
# apply.sh's post-restart health check instead. See
# ../../build-docs/ops-execution.md.
#
# Trigger this on every push that touches otel/. A broken config must fail here,
# not at 3am on a box someone is trying to debug.

steps:
  - id: render-and-validate
    name: ubuntu:24.04
    entrypoint: bash
    env:
      # KEEP IN STEP WITH OTELCOL_VERSION IN
      # build-vm-images/scripts/ubuntu/versions.env. Validating against a
      # different version than the fleet runs is worse than not validating: it
      # reports green on a config the VMs will reject. There is no way to
      # reference that file from here (different repo), so this is a manual
      # pairing - bump both together.
      - 'OTELCOL_VERSION=0.130.0'
    args:
      - -c
      - |
        set -euo pipefail

        apt-get update -qq && apt-get install -yqq curl ca-certificates >/dev/null

        echo "== Fetching otelcol-contrib ${OTELCOL_VERSION} =="
        curl -fsSL -o /tmp/otelcol.tar.gz \
          "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${OTELCOL_VERSION}/otelcol-contrib_${OTELCOL_VERSION}_linux_amd64.tar.gz"
        tar -xzf /tmp/otelcol.tar.gz -C /usr/local/bin otelcol-contrib
        otelcol-contrib --version

        cd otel

        # Every config must be reachable by a flavor name that actually exists.
        # A config for a flavor that was renamed or removed is dead weight that
        # still passes validation, so check the pairing explicitly.
        echo "== Flavor coverage =="
        for cfg in configs/*.yaml; do
          echo "  found config for flavor: $(basename "$cfg" .yaml)"
        done

        # The env vars the configs reference via ${env:...}. The collector
        # expands them at load, so validate needs them SET but not correct -
        # these are placeholders that prove the reference resolves, nothing more.
        export OTEL_DEPLOY_ENV=ci
        export OTEL_SERVICE_NAME=ci
        export OTEL_ES_ENDPOINT=https://example.invalid:9200
        export OTEL_ES_API_KEY=ci
        export OTEL_CH_ENDPOINT=tcp://example.invalid:9000
        export OTEL_CH_USERNAME=ci
        export OTEL_CH_PASSWORD=ci

        fail=0
        echo "== Validating every flavor x exporter combination =="
        for cfg in configs/*.yaml; do
          flavor="$(basename "$cfg" .yaml)"

          for exp in exporters/*.yaml none; do
            if [ "$exp" = "none" ]; then
              name="nop"; block="  nop:"; label="none"
            else
              label="$(basename "$exp" .yaml)"
              name="$(sed -n 's/^#[[:space:]]*name:[[:space:]]*//p' "$exp" | head -n1)"
              # From the first non-comment, non-blank line: drops the whole
              # leading header. MUST match push.sh's extraction exactly, or CI
              # validates something different from what ships.
              block="$(awk 'started || (!/^#/ && NF) { started = 1; print }' "$exp")"
              if [ -z "$name" ]; then
                echo "FAIL  $exp has no '# name:' header line"
                fail=1
                continue
              fi
            fi

            out="/tmp/${flavor}.${label}.yaml"
            awk -v block="$block" -v name="$name" '
              /@EXPORTER@/      { print block; next }
              /@EXPORTER_NAME@/ { gsub(/@EXPORTER_NAME@/, name); print; next }
                                { print }
            ' "$cfg" > "$out"

            if grep -q '@EXPORTER' "$out"; then
              echo "FAIL  ${flavor} x ${label}: unsubstituted placeholder"
              fail=1
              continue
            fi

            # Every config must declare the health_check extension on the
            # endpoint apply.sh polls. Without it apply.sh rolls back a
            # perfectly good config because it cannot confirm the collector
            # came up - a failure mode that is very confusing in the field and
            # trivial to catch here.
            if ! grep -q '127.0.0.1:13133' "$out"; then
              echo "FAIL  ${flavor} x ${label}: no health_check on 127.0.0.1:13133"
              fail=1
              continue
            fi

            if otelcol-contrib validate --config "$out" >/tmp/v.log 2>&1; then
              echo "ok    ${flavor} x ${label}"
            else
              echo "FAIL  ${flavor} x ${label}"
              sed 's/^/        /' /tmp/v.log
              fail=1
            fi
          done
        done

        [ "$fail" -eq 0 ] || { echo; echo "One or more configs failed validation."; exit 1; }
        echo
        echo "All combinations valid."

  - id: shellcheck
    name: koalaman/shellcheck-alpine:stable
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        # apply.sh runs as root on every VM and push.sh handles credentials.
        # Both are worth linting on every change.
        shellcheck otel/apply.sh otel/push.sh

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 600s
